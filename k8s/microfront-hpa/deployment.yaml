apiVersion: apps/v1
kind: Deployment
metadata:
  name: microfront-hpa
  namespace: microfront
  labels:
    app: microfront-hpa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microfront-hpa
  template:
    metadata:
      labels:
        app: microfront-hpa
    spec:
      containers:
        - name: microfront-hpa
          image: nginx:1.30.4
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

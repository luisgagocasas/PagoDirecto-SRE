apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microfront-gitops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/luisgagocasas/PagoDirecto-SRE.git
    targetRevision: main
    path: k8s/microfront-gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: microfront
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
